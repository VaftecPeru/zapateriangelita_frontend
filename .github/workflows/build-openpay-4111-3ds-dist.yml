name: Build Openpay 4111 3DS dist
on:
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package cPanel
        run: |
          cd dist
          zip -r ../dist-zapateria-angelita-openpay-4111-3ds-20260918.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: dist-zapateria-angelita-openpay-4111-3ds-20260918
          path: dist-zapateria-angelita-openpay-4111-3ds-20260918.zip
          retention-days: 7
