name: Hotfix Openpay alertas certificacion v2

on:
  push:
    branches:
      - fix/openpay-alertas-certificacion-v2

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/openpay-alertas-certificacion-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Aplicar hotfix Openpay
        run: python scripts/hotfix_openpay_alerts_v2.py

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar frontend
        run: npm run build

      - name: Verificar dist
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -d dist/assets

      - name: Guardar cambios del hotfix
        run: |
          rm -f .github/workflows/hotfix-openpay-alertas-v2.yml
          rm -f scripts/hotfix_openpay_alerts_v2.py
          rm -f .hotfix-openpay-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: mostrar alertas Openpay después de verificar tarjeta"
          git push origin HEAD:fix/openpay-alertas-certificacion-v2
