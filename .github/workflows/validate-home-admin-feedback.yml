name: Validate home admin feedback

on:
  push:
    branches:
      - feature/home-content-admin-feedback-20260919

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify dist
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "Feedback build OK"
