name: Patch checkout editor temp

on:
  push:
    branches:
      - fix/checkout-3ds-auto-login

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[checkout-editor-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/checkout-3ds-auto-login
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Integrar editor en checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/CheckoutPageV2.tsx')
          text = path.read_text()

          import_line = 'import PaymentModal, { OpenpayChargeResult } from "../components/PaymentModal";\n'
          editor_import = 'import EditableOrderSummary from "../components/EditableOrderSummary";\n'
          if editor_import not in text:
              text = text.replace(import_line, import_line + editor_import)

          pattern = re.compile(r'          <aside style=\{cardStyle\}>.*?          </aside>', re.S)
          replacement = '''          <EditableOrderSummary
            onVariantChanged={() => {
              // Cualquier cambio de cantidad/talla/color invalida sesiones de pago previas.
              clearCheckoutSession();
              setOrderData(null);
              setShowPayment(false);
              setError(null);
            }}
          />'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'No se pudo reemplazar Resumen del pedido: {count}')

          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run build
      - name: Verificar build
        run: |
          test -f dist/index.html
          test -d dist/assets
      - name: Guardar cambio validado
        run: |
          rm .github/workflows/patch-checkout-editor-temp.yml
          git config user.name "VaftecPeru"
          git config user.email "vaftecperusac@gmail.com"
          git add src/pages/CheckoutPageV2.tsx .github/workflows/patch-checkout-editor-temp.yml
          git commit -m "feat: integrar editor moderno en resumen del pedido [checkout-editor-ready]"
          git push origin HEAD:fix/checkout-3ds-auto-login
