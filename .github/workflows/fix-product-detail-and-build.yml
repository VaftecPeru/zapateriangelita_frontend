name: Fix product detail and build

on:
  push:
    branches:
      - feature/catalog-management

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/catalog-management
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch product detail null-safe relations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/ProductDetailPage.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''    categoryName: typeof product.category === "object" ? product.category.name : product.category || "Calzado",
    subcategoryName: typeof (product as any).subcategory === "object"
      ? (product as any).subcategory.name
      : (product as any).subcategory || "Sin subcategoría",
    brandName: typeof product.brand === "object" ? product.brand.name : product.brand || "Sin marca",'''
          new = '''    categoryName: product.category && typeof product.category === "object" ? product.category.name : product.category || "Calzado",
    subcategoryName: (product as any).subcategory && typeof (product as any).subcategory === "object"
      ? (product as any).subcategory.name
      : (product as any).subcategory || "Sin subcategoría",
    brandName: product.brand && typeof product.brand === "object" ? product.brand.name : product.brand || "Sin marca",'''
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          elif new in s:
              print('Product detail already patched')
          else:
              raise SystemExit('Expected normalizeProduct block not found')
          PY
      - run: npm ci
      - run: npm run build
      - name: Upload production dist
        uses: actions/upload-artifact@v4
        with:
          name: zapateriangelita-dist-catalog-fix
          path: dist/
          include-hidden-files: true
      - name: Commit fix to branch
        run: |
          git config user.name "VaftecPeru"
          git config user.email "vaftecperusac@gmail.com"
          git add src/pages/ProductDetailPage.tsx
          if git diff --cached --quiet; then
            echo "No code changes to commit"
          else
            git commit -m "fix: tolerate null catalog relations in product detail"
            git push origin HEAD:feature/catalog-management
          fi
