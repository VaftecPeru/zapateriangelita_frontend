name: Build deployable dist artifact

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-dist-artifact.yml"
  workflow_dispatch:

jobs:
  build-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:ui
      - run: npm run lint
      - name: Upload production dist
        uses: actions/upload-artifact@v4
        with:
          name: zapateriangelita-dist-main-0e47b4c
          path: dist/
          if-no-files-found: error
          retention-days: 7
