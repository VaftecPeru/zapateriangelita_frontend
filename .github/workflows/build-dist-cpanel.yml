name: Build dist cPanel

on:
  push:
    branches:
      - main

jobs:
  build:
    if: ${{ contains(github.event.head_commit.message, 'build: generar dist para cPanel') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: zapateriangelita-dist-cpanel
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
