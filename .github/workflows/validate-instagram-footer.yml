name: Validate Instagram footer

on:
  push:
    branches:
      - feature/instagram-footer-payments

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify dist
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "Instagram/footer build OK"
