name: Validate corrective frontend

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'ci/export-develop-dist-20261015'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Run UI regression tests
        run: npm run test:ui

      - name: Lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Package develop dist
        if: success()
        run: |
          cd dist
          zip -r ../Angelita_FRONTEND_dist_develop_cc16189_20261015.zip .

      - name: Upload develop dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Angelita_FRONTEND_dist_develop_cc16189_20261015
          path: Angelita_FRONTEND_dist_develop_cc16189_20261015.zip
          retention-days: 7
