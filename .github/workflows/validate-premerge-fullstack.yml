name: Validate corrective frontend
on:
  push:
    branches:
      - fix/premerge-fullstack-20260918
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:ui
      - run: npm run lint
      - run: npm audit --omit=dev
