name: Fullstack UX Audit Frontend
on:
  push:
    branches:
      - audit/fullstack-ux-20260918
  pull_request:
    branches:
      - main
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency tree
        run: npm ls --depth=0
        continue-on-error: true
      - name: TypeScript and production build
        run: npm run build
      - name: Existing UI component tests
        run: npm run test:ui
        continue-on-error: true
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
