name: Fix postpay verification retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-postpay-verification-retry.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar verificación robusta post pago
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/CheckoutPageV2.tsx')
          text = path.read_text()
          start_marker = '    const verifyPayment = async () => {'
          end_marker = '    verifyPayment();'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'No se encontró bloque verifyPayment: {start}, {end}')

          replacement = '''    const sleep = (ms: number) => new Promise((resolve) => window.setTimeout(resolve, ms));

    const verifyPayment = async () => {
      setVerifyingPayment(true);
      setError(null);

      const maxAttempts = 8;
      let lastMessage = "Estamos confirmando tu pago con Openpay.";

      try {
        for (let attempt = 1; attempt <= maxAttempts && !cancelled; attempt += 1) {
          try {
            const { data } = await apiClient.get("/checkout/payments/openpay/verify", {
              params: {
                order_id: orderId,
                transaction_id: transactionId,
                checkout_token: checkoutToken,
              },
              // El primer retorno puede tardar si el servidor termina tareas posteriores
              // al pago. Un timeout corto permite reintentar de forma idempotente sin
              // volver a cobrar: el backend reemite la sesión si el pedido ya está pagado.
              timeout: 10000,
            });

            if (cancelled) return;

            if (data.payment_status === "paid") {
              finishPaidPurchase(data);
              return;
            }

            if (data.payment_status === "failed") {
              setError(data.message || "El pago no fue aprobado.");
              navigate("/checkout", { replace: true });
              return;
            }

            if (data.payment_status === "processing") {
              lastMessage = data.message || "Openpay todavía está confirmando tu pago.";
              if (attempt < maxAttempts) {
                await sleep(attempt <= 2 ? 1200 : 2200);
                continue;
              }
            } else {
              lastMessage = data.message || "Estamos verificando el estado final de tu compra.";
            }
          } catch (err: any) {
            if (cancelled) return;

            const responseData = err.response?.data;
            const errorCode = responseData?.error_code;
            const status = Number(err.response?.status || 0);

            if (errorCode === "CHECKOUT_TOKEN_INVALID") {
              clearCheckoutSession(orderId);
              setError(
                "La sesión segura de esta compra ya no coincide con el pedido. No repitas el cobro. Si el pago fue aprobado, inicia sesión con el correo utilizado y revisa Mis Compras."
              );
              navigate("/checkout", { replace: true });
              return;
            }

            const retryable =
              !err.response ||
              err.code === "ECONNABORTED" ||
              status >= 500 ||
              [408, 409, 429].includes(status);

            if (!retryable) {
              setError(
                responseData?.message ||
                  "No fue posible verificar el pago con Openpay. No repitas el cobro hasta confirmar su estado."
              );
              navigate("/checkout", { replace: true });
              return;
            }

            lastMessage =
              responseData?.message ||
              "El pago fue enviado y estamos esperando la confirmación final de Openpay.";

            if (attempt < maxAttempts) {
              await sleep(attempt <= 2 ? 1200 : 2200);
              continue;
            }
          }
        }

        if (!cancelled) {
          setError(
            `${lastMessage} No realices otro cobro. Si ya recibiste confirmación, inicia sesión con el correo utilizado y revisa Mis Compras.`
          );
          navigate("/checkout", { replace: true });
        }
      } finally {
        if (!cancelled) setVerifyingPayment(false);
      }
    };

'''

          path.write_text(text[:start] + replacement + text[end:])

      - name: Validar build frontend
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          test -f dist/.htaccess
          test -d dist/assets
          grep -q "maxAttempts = 8" src/pages/CheckoutPageV2.tsx
          grep -q "timeout: 10000" src/pages/CheckoutPageV2.tsx
          grep -q "finishPaidPurchase(data)" src/pages/CheckoutPageV2.tsx

      - name: Guardar corrección en main
        run: |
          git config user.name "VaftecPeru"
          git config user.email "vaftecperusac@gmail.com"
          git add src/pages/CheckoutPageV2.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: reintentar verificación 3DS y completar auto-login"
          git push origin main
